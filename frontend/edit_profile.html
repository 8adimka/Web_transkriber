<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile.edit">Edit profile</title>
    <script src="ui.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header"><nav class="workspace-nav" aria-label="Main navigation" data-i18n-aria-label="nav.main"><a href="index.html" data-i18n="nav.workspace">Workspace</a><a href="transcriptions.html" data-i18n="nav.saved">Saved texts</a><a href="profile.html" aria-current="page" data-i18n="nav.profile">Profile</a></nav><div class="header-actions"><label class="theme-toggle"><span data-i18n="theme.label">Dark mode</span><span class="theme-switch"><input type="checkbox" role="switch" data-theme-toggle data-i18n-aria-label="common.themeToggle" aria-label="Switch dark mode" checked><span class="switch-track" aria-hidden="true"></span></span></label><div id="authSection" class="auth-section"><div id="userInfo" class="user-info-header" style="display:none;"><span id="userName" class="user-email"></span><button type="button" id="logoutBtn" class="button small secondary" data-i18n="nav.logout">Log out</button></div><div id="loginPrompt"><a href="login.html" data-i18n="nav.login">Log in</a></div></div></div></header>

<main class="edit-profile-container">
    <div class="page-heading"><h1 data-i18n="profile.edit">Edit profile</h1></div>
    <div id="loading" class="loading" role="status" data-i18n="profile.loading">Loading your profile…</div>
    <div id="error" class="error" role="alert" style="display:none;"></div><div id="success" class="success" role="status" style="display:none;"></div>
    <div id="profileContent" style="display:none;">
        <section class="form-section settings-section"><h2 data-i18n="common.avatar">Avatar</h2>
            <div class="avatar-preview"><img id="currentAvatar" class="avatar" src="avatar-placeholder.svg" alt="Avatar" data-i18n-alt="common.avatar"><div class="avatar-actions"><button type="button" id="uploadAvatarBtn" class="button small secondary" data-i18n="profile.uploadAvatar">Upload image</button><button type="button" id="removeAvatarBtn" class="button small secondary" data-i18n="profile.removeAvatar">Remove avatar</button></div></div>
            <div class="form-group"><label for="avatarUrl" data-i18n="profile.avatarUrl">Avatar image URL</label><input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg"><small data-i18n="profile.avatarHint">Paste an image URL to update your avatar.</small></div>
        </section>
        <section class="form-section settings-section"><h2 data-i18n="profile.account">Personal information</h2>
            <div class="form-group"><label for="fullName" data-i18n="profile.fullName">Name</label><input type="text" id="fullName" autocomplete="name" placeholder="Your name" data-i18n-placeholder="profile.namePlaceholder"></div>
            <div class="form-group"><label for="email" data-i18n="profile.email">Email</label><input type="email" id="email" autocomplete="email" readonly><small data-i18n="profile.emailHint">Your email address cannot be changed.</small></div>
            <div class="form-group"><label for="createdAt" data-i18n="profile.registrationDate">Registration date</label><input type="text" id="createdAt" readonly></div>
        </section>
        <section class="form-section settings-section"><h2 data-i18n="password.title">Change password</h2>
            <div class="form-group"><label for="currentPassword" data-i18n="password.current">Current password</label><input type="password" id="currentPassword" autocomplete="current-password"></div>
            <div class="form-group"><label for="newPassword" data-i18n="password.new">New password</label><input type="password" id="newPassword" autocomplete="new-password" minlength="8"><div id="passwordStrength" class="password-strength" role="status"></div></div>
            <div class="form-group"><label for="confirmPassword" data-i18n="password.confirm">Confirm new password</label><input type="password" id="confirmPassword" autocomplete="new-password"><button type="button" id="changePasswordBtn" class="button secondary" data-i18n="password.change">Change password</button></div>
        </section>
        <div class="form-actions actions"><button type="button" id="saveProfileBtn" class="button primary" data-i18n="common.save">Save changes</button><button type="button" id="cancelBtn" class="button secondary" data-i18n="common.cancel">Cancel</button></div>
    </div>
</main>
    </div>
    <script src="auth.js"></script><script src="edit_profile.js"></script>
</body>
</html>
