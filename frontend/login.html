<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.loginTitle">Welcome back</title>
    <script src="ui.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container auth-container">
        <header class="app-header"><nav class="workspace-nav" aria-label="Main navigation" data-i18n-aria-label="nav.main"><a href="index.html" data-i18n="nav.workspace">Workspace</a><a href="transcriptions.html" data-i18n="nav.saved">Saved texts</a><a href="profile.html" data-i18n="nav.profile">Profile</a></nav><div class="header-actions"><label class="theme-toggle"><span data-i18n="theme.label">Dark mode</span><span class="theme-switch"><input type="checkbox" role="switch" data-theme-toggle data-i18n-aria-label="common.themeToggle" aria-label="Switch dark mode" checked><span class="switch-track" aria-hidden="true"></span></span></label></div></header>

<main class="auth-form">
    <div class="page-heading"><h1 data-i18n="auth.loginTitle">Welcome back</h1><p data-i18n="auth.loginHint">Log in to continue with your texts.</p></div>
    <form id="loginForm"><div class="form-group"><label for="email" data-i18n="profile.email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div><div class="form-group"><label for="password" data-i18n="auth.password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div><button type="submit" class="button primary" data-i18n="nav.login">Log in</button></form>
    <div class="auth-divider"><span data-i18n="auth.or">or</span></div>
    <button type="button" id="googleLoginBtn" class="button google-btn"><span class="google-mark" aria-hidden="true">G</span><span data-i18n="auth.google">Continue with Google</span></button>
    <div class="auth-links"><a href="register.html" data-i18n="auth.noAccount">New here? Create an account</a></div>
    <div id="authStatus" class="status-bar" role="status" aria-live="polite"></div>
</main>
    </div>
    <script src="auth.js"></script>
</body>
</html>
